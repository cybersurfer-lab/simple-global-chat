<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Simple Global Chat</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Simple Global Chat</h1>
        <div id="top-controls">
            <input id="username" placeholder="Dein Name">
            <input id="room" placeholder="Raum (z.B. global)" value="global">
            <button id="joinRoom">Raum betreten</button>

            <label class="theme-toggle">
                <span>🌙/☀️</span>
                <input type="checkbox" id="themeToggle">
            </label>
        </div>
    </header>

    <main id="chat-container">
        <textarea id="log" readonly></textarea>

        <div id="input-area">
            <input id="msg" placeholder="Nachricht eingeben">
            <button id="send">Senden</button>
        </div>

        <div id="file-area">
            <input type="file" id="fileInput">
            <button id="sendFile">Datei senden</button>
        </div>

        <div id="progress-area">
            <div id="progress-bar">
                <div id="progress-fill"></div>
            </div>
            <span id="progress-text"></span>
        </div>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
